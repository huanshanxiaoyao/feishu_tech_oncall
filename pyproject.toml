[project]
name = "badcase-bot"
version = "0.1.0"
description = "线上排查助手 —— 飞书消息链路骨架（第一步：打通消息 + 卡片回执/更新 + 存储）"
requires-python = ">=3.12"
dependencies = [
    "lark-oapi>=1.7.3",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "aiosqlite>=0.20",
    "structlog>=24.0",
    "claude-agent-sdk>=0.2.150,<0.3",
    "pyyaml>=6.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
